name: Sprawdzanie jakości strony
on:
  push:
    branches: [main]
  pull_request:
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sprawdź składnię JavaScript
        run: |
          node --check v2/contact.js
          node --check v2/chat-assistant.js
          node --check scripts/audit.mjs
          node --check scripts/build.mjs
          node --check scripts/test-contact.mjs
          node --check scripts/preview.mjs
      - name: Testy formularza API bez wysyłania e-maili
        run: node scripts/test-contact.mjs
      - name: Sprawdź pliki HTML i odnośniki
        run: node scripts/audit.mjs
      - name: Zbuduj podgląd bez indeksowania
        run: |
          node scripts/preview.mjs
          test -f dist-preview/index.html
          test -f dist-preview/robots.txt
          grep -q 'noindex,nofollow' dist-preview/index.html
          grep -q 'X-Robots-Tag: noindex, nofollow' dist-preview/_headers
          test -f dist-preview/kampanie/szkody-gornicze.html
          test -f dist-preview/kampanie/swiadczenie-wspierajace.html
          grep -q 'Disallow: /' dist-preview/robots.txt
