name: Sprawdzanie jakości strony
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: twoja-sprawa-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sprawdź składnię JavaScript
        run: |
          node --check v2/contact.js
          node --check v2/mobile-service-cta.js
          node --check scripts/test-mobile-service-cta.mjs
          node --check scripts/indexnow-routes.mjs
          node --check scripts/submit-indexnow.mjs
          node --check scripts/test-indexnow-routes.mjs
          node --check v2/campaign-links.js
          node --check v2/attribution.js
          node --check scripts/test-attribution.mjs
          node --check v2/chat-assistant.js
          node --check v2/share-page.js
          node --check v2/network-brand.js
          node --check scripts/test-chat-lead.mjs
          node --check v2/service-navigator.js
          node --check scripts/test-service-navigator.mjs
          node --check scripts/test-home-clarity.mjs
          node --check scripts/test-leaflet-start.mjs
          node --check scripts/test-1000-regressions.mjs
          node --check v2/knowledge-hub.js
          node --check scripts/test-knowledge-hub.mjs
          node --check v2/article-accessibility.js
          node --check scripts/test-article-accessibility.mjs
          node --check scripts/test-release-readiness.mjs
          node --check v2/plan-dzialania.js
          node --check scripts/test-action-plan.mjs
          node --check scripts/test-50-continuations.mjs
          node --check v2/faq.js
          node --check scripts/test-faq.mjs
          node --check scripts/test-50-continuations-iii.mjs
          node --check v2/search-pages-1.js
          node --check v2/search-pages-2.js
          node --check v2/search-faq-data.js
          node --check v2/search-core.js
          node --check v2/site-search.js
          node --check scripts/test-500-continuations.mjs
          node --check scripts/test-search-index-freshness.mjs
          node --check scripts/audit.mjs
          node --check scripts/build.mjs
          node --check scripts/public-routes.mjs
          node --check scripts/test-public-routes.mjs
          node --check scripts/seo-policy.mjs
          node --check scripts/test-seo-policy.mjs
          node --check scripts/test-campaign-links.mjs
          node --check scripts/test-contact-client.mjs
          node --check scripts/test-contact.mjs
          node --check scripts/preview.mjs
          node --check scripts/network-brand.mjs
          node --check scripts/test-network-brand.mjs
      - name: Testy formularza API bez wysyłania e-maili
        run: node scripts/test-contact.mjs
      - name: Przetestuj generator kampanii bez połączenia z siecią
        run: node scripts/test-campaign-links.mjs
      - name: Przetestuj formularz w przeglądarce symulowanej bez wysyłki danych
        run: node scripts/test-contact-client.mjs
      - name: Test mobilnej ścieżki kontaktu dwóch usług
        run: node scripts/test-mobile-service-cta.mjs
      - name: Test przyszłych adresów IndexNow i wykluczeń SEO
        run: node scripts/test-indexnow-routes.mjs
      - name: Przetestuj ścieżki chatbota do formularza z zachowaniem źródła kampanii
        run: node scripts/test-chat-lead.mjs
      - name: Przetestuj atrybucję kampanii między podstronami
        run: node scripts/test-attribution.mjs
      - name: Przetestuj nowy przewodnik wyboru usługi i etapu sprawy
        run: node scripts/test-service-navigator.mjs
      - name: Sprawdź hierarchię strony głównej i siatkę 2+4 usług
        run: node scripts/test-home-clarity.mjs
      - name: Testuj wejście z drukowanej ulotki i bezpieczne źródło kontaktu
        run: node scripts/test-leaflet-start.mjs
      - name: Seria V — 1000 sekwencyjnych kontroli 62 materiałów i ścieżek
        run: node scripts/test-1000-regressions.mjs
      - name: Testuj wyszukiwarkę i filtry poradników
        run: node scripts/test-knowledge-hub.mjs
      - name: Testuj narzędzia czytania we wszystkich poradnikach
        run: node scripts/test-article-accessibility.mjs
      - name: Sprawdź politykę indeksowania przyszłej publikacji
        run: node scripts/test-seo-policy.mjs
      - name: Sprawdź kanoniczne adresy Cloudflare Pages
        run: node scripts/test-public-routes.mjs
      - name: Kontrola bramek przed oficjalną publikacją
        run: node scripts/test-release-readiness.mjs
      - name: Test interaktywnego planu pierwszych kroków
        run: node scripts/test-action-plan.mjs
      - name: 50 kolejnych kontroli serwisu
        run: node scripts/test-50-continuations.mjs
      - name: Test wyszukiwarki i filtrowania 24 pytań FAQ
        run: node scripts/test-faq.mjs
      - name: Seria III — 50 kolejnych kontroli FAQ, treści, SEO i prywatności
        run: node scripts/test-50-continuations-iii.mjs
      - name: Seria IV — 500 kontroli wyszukiwarki, źródeł i prywatności
        run: node scripts/test-500-continuations.mjs
      - name: Aktualność źródeł indeksu wyszukiwarki
        run: node scripts/test-search-index-freshness.mjs
      - name: Sprawdź pliki HTML i odnośniki
        run: node scripts/audit.mjs
      - name: Sprawdź logotypy partnerów na każdej podstronie
        run: node scripts/test-network-brand.mjs
      - name: Zbuduj podgląd bez indeksowania
        run: |
          node scripts/preview.mjs
          test -f dist-preview/index.html
          test -f dist-preview/robots.txt
          grep -q 'noindex,nofollow' dist-preview/index.html
          grep -q 'X-Robots-Tag: noindex, nofollow' dist-preview/_headers
          test -f dist-preview/kampanie/szkody-gornicze.html
          test -f dist-preview/kampanie/swiadczenie-wspierajace.html
          test -f dist-preview/narzedzia/linki-kampanii.html
          test -f dist-preview/attribution.js
          test -f dist-preview/assets/site-mark.svg
          test -f dist-preview/network-brand.css
          test -f dist-preview/network-brand.js
          grep -q 'network-brand.js?v=' dist-preview/index.html
          grep -q 'class="network-brand-bar"' dist-preview/index.html
          grep -q 'class="network-brand-bar"' dist-preview/404.html
          grep -q 'class="network-brand-bar"' dist-preview/kampanie/szkody-gornicze.html
          grep -q 'class="network-brand-bar"' dist-preview/kampanie/swiadczenie-wspierajace.html
          grep -q 'rel="icon" type="image/svg+xml" href="/assets/site-mark.svg"' dist-preview/index.html
          grep -q 'Referrer-Policy: strict-origin-when-cross-origin' dist-preview/_headers
          grep -q 'Permissions-Policy: geolocation=(), camera=(), microphone=()' dist-preview/_headers
          grep -q 'src="/attribution.js"' dist-preview/index.html
          grep -q 'src="/attribution.js"' dist-preview/poradniki/checklista-szkody-gorniczej.html
          grep -q 'Disallow: /' dist-preview/robots.txt
