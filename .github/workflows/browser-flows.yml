name: Test formularzy w przeglądarce — Cloudflare
on:
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - 'scripts/test-browser-flows.mjs'
      - 'scripts/build.mjs'
      - 'scripts/network-brand.mjs'
      - 'scripts/subpage-css-bundles.mjs'
      - 'scripts/test-subpage-bundles.mjs'
      - 'scripts/test-production-bundle.mjs'
      - '.github/workflows/browser-flows.yml'
  workflow_dispatch:
concurrency:
  group: twoja-sprawa-browser-flows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium:
    name: Siedem scenariuszy formularzy bez wysyłki
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Sprawdź składnię testu przeglądarkowego
        run: node --check scripts/test-browser-flows.mjs
      - name: Zainstaluj bezpłatne narzędzia Chromium
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.64.1 axe-core@4.14.0
          # Only the headless shell is required by chromium.launch({headless:true}).
          # Avoid apt-get dependency installation: ubuntu-latest mirror failures
          # previously blocked tests before any site assertions could execute.
          for attempt in 1 2 3; do
            if npx playwright install chromium --only-shell; then
              exit 0
            fi
            echo "Chromium download failed (attempt ${attempt}/3)"
            sleep $((attempt * 8))
          done
          echo "Chromium installation failed after 3 attempts" >&2
          exit 1
      - name: Poczekaj na wdrożenie i sprawdź wszystkie ścieżki
        run: node scripts/test-browser-flows.mjs
