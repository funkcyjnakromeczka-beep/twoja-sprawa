name: Test formularzy w przeglądarce — Cloudflare
on:
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - 'scripts/test-browser-flows.mjs'
      - 'scripts/build.mjs'
      - 'scripts/subpage-css-bundles.mjs'
      - 'scripts/test-subpage-bundles.mjs'
      - 'scripts/test-production-bundle.mjs'
      - '.github/workflows/browser-flows.yml'
  workflow_dispatch:
concurrency:
  group: twoja-sprawa-browser-flows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium:
    name: Siedem scenariuszy formularzy bez wysyłki
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Sprawdź składnię testu przeglądarkowego
        run: node --check scripts/test-browser-flows.mjs
      - name: Zainstaluj bezpłatne narzędzia Chromium
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.64.1 axe-core@4.14.0
          npx playwright install --with-deps chromium
      - name: Poczekaj na wdrożenie i sprawdź wszystkie ścieżki
        run: node scripts/test-browser-flows.mjs
