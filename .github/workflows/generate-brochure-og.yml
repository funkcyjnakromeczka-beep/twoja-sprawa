name: Budowa sześciu grafik broszur do Facebooka
on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-brochure-og.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: twoja-sprawa-brochure-og-assets
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Pillow for locally authored image assets
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Render six verified social cards
        run: python scripts/generate-brochure-og.py
      - name: Verify 1200x630 dimensions and distinct images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          keys=['szkody-gornicze','swiadczenie-wspierajace','renty-powypadkowe','skd','kredyty-frankowe','sluzebnosc-przesylu']
          hashes=set()
          for key in keys:
              p=Path('v2/assets')/('og-broszura-'+key+'.jpg')
              with Image.open(p) as im:
                  assert im.format=='JPEG' and im.size==(1200,630),p
              assert 15000 < p.stat().st_size < 400000, p
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              assert h not in hashes,'Duplicated preview: '+key
              hashes.add(h)
          print('SIX_UNIQUE_BROCHURE_OG_IMAGES_OK')
          PY
      - name: Save first-party image assets to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2/assets/og-broszura-*.jpg
          if git diff --cached --quiet; then
            echo 'Six card assets unchanged'
            exit 0
          fi
          git commit -m 'assets(og): six individual client brochure social cards'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
