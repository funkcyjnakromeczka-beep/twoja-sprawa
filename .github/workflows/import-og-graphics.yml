name: Import nine new Open Graph image assets
on:
  push:
    paths:
      - .github/workflows/import-og-graphics.yml
permissions:
  contents: write
jobs:
  publish-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download original generated PNGs, validate and optimize into 1200x630 JPEG
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          mkdir -p v2/assets
          for name in og-szkody-gornicze og-swiadczenie-wspierajace og-renty-powypadkowe og-skd og-skd-dokumenty og-sluzebnosc-przesylu og-kredyty-frankowe og-szkody-lubin og-szkody-polkowice; do
            case "$name" in
          og-szkody-gornicze) src="https://d2jqrm6oza8nb6.cloudfront.net/datasets/ab4f40c0-9b00-4872-84a0-9e3b75053982.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNDE2MWY3YjYxMzZiZDc1OCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTQ4MzQ0Nn0.nSeBaXmTwA2wlF1811BsD2C_RHyLP97BOVTxS6ub2lw";;
          og-swiadczenie-wspierajace) src="https://d2jqrm6oza8nb6.cloudfront.net/datasets/f8176f46-7a77-4458-90e0-c64e4fd5fc3f.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZWQwMDU1NzU5NjMxMjFkNSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTQ4NjA2OX0.PhzlBHFDfup6CMLxP3qDlkcHCR8EmcFqV7c5GqzWBYY";;
          og-renty-powypadkowe) src="https://d2jqrm6oza8nb6.cloudfront.net/datasets/99844e2a-d908-4493-8694-4d71e864bcd3.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYTE1NWMwYmIzM2Y2NmIyNCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTQ5MDg3NX0.tNMK_7EQnDe8V9ib6OQ5WR1h71ZJAdVzQ9LHSevmsQw";;
          og-skd) src="https://d2jqrm6oza8nb6.cloudfront.net/datasets/fa7125c6-2271-461c-83ff-75354440c95c.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiODRkNjUyMDgxZDFlZTBlMiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTUxNTAxNn0.mPf2v01satbZOCGsP10tvKeJtA36qxyT26seILCw9WU";;
          og-skd-dokumenty) src="https://d2jqrm6oza8nb6.cloudfront.net/datasets/610e8942-9c57-476d-80d9-8b5d87109193.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZjRkZTAzOWE4ZGZkNzBhOCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTUyMTgxOH0.7WIH6GFyXDawlxIKLXSY0lTkQtSbs2KxLehimlNKnMc";;
          og-sluzebnosc-przesylu) src="https://d2jqrm6oza8nb6.cloudfront.net/datasets/f8adb8e5-d5ac-4ed8-a716-975b14a68b8f.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNDRkMDQzM2U1NzM0NGM1NiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTUwMDk5MH0.ahzFwBsf-4415iGUupy9oeugCQcGCzdZNub9zXCkutU";;
          og-kredyty-frankowe) src="https://d2jqrm6oza8nb6.cloudfront.net/datasets/c7758311-9e70-493d-a386-e16bac7e7463.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMjNiODljZjFiYWVhMDk0ZiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTUwOTM2MX0.aqKkwP8dIgNiYz-Ar4jFseE2v1ftej-XT26akeCzw4c";;
          og-szkody-lubin) src="https://d2jqrm6oza8nb6.cloudfront.net/datasets/8606c5a4-0fbc-4186-867f-cba824f7ea1c.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNmVjMDc5MjM0ZGQ1NGZjMiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTU1NDA4M30.XliWwqqigojcZjVsfbyySFnsmlRfXbH3CY0SVSVNUjc";;
          og-szkody-polkowice) src="https://d2jqrm6oza8nb6.cloudfront.net/datasets/ed085252-915d-4fe7-8ff1-48b865eca48f.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMjMyZmZiN2Q2ZWJiNzU0ZiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTU0MDczM30.t4PQSOHOba7Oyl0jqgO_d-XIsQL0pTvOloYVGWITdAA";;
            esac
            curl -fsSL --retry 2 --connect-timeout 15 --max-time 45 "$src" -o "/tmp/$name.png"
            OG_FILE="$name" python - <<'PY'
          import os
          from PIL import Image,ImageOps
          name=os.environ["OG_FILE"]
          with Image.open("/tmp/"+name+".png") as im:
              im=im.convert("RGB")
              im=ImageOps.fit(im,(1200,630),method=Image.Resampling.LANCZOS,centering=(0.5,0.5))
              path="v2/assets/"+name+".jpg"
              im.save(path,format="JPEG",quality=84,optimize=True,progressive=True,subsampling=0)
              print("IMAGE_READY",path,os.stat(path).st_size,im.size,flush=True)
          PY
          done
      - name: Store immutable first-party image assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/assets/og-szkody-gornicze.jpg v2/assets/og-swiadczenie-wspierajace.jpg v2/assets/og-renty-powypadkowe.jpg v2/assets/og-skd.jpg v2/assets/og-skd-dokumenty.jpg v2/assets/og-sluzebnosc-przesylu.jpg v2/assets/og-kredyty-frankowe.jpg v2/assets/og-szkody-lubin.jpg v2/assets/og-szkody-polkowice.jpg
          git commit -m "Import thematic 1200x630 Open Graph previews for nine business topics"
          git push origin HEAD:main
