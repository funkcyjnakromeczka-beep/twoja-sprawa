name: Audyt aktualnej produkcji — Cloudflare Pages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-audit.yml'
      - 'scripts/audit-production-current.mjs'
  workflow_dispatch:
concurrency:
  group: twoja-sprawa-live-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  live-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Składnia audytu
        run: node --check scripts/audit-production-current.mjs
      - name: Sprawdz aktualny uklad, kontakty, SEO, formularze i publikacje
        run: node scripts/audit-production-current.mjs
