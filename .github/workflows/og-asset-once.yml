name: Jednorazowo przygotuj graficzny podgląd Facebook
on:
  push:
    branches:
      - feat/facebook-udostepnianie-grafika-20261119
permissions:
  contents: write
jobs:
  create-social-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Pobierz źródłową grafikę Canva i wygeneruj pełny JPEG 1200x630
        env:
          CANVA_THUMBNAIL_URL: "https://media.canva.com/v2/image-resize/format:PNG/height:105/quality:100/uri:ifs%3A%2F%2FM%2F890dcd33-1ae3-4666-b3f3-972994cd297d/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAFAH64R_FznhBdonH4e_zPzlccWdnuydmA3ZM72YyfF9&exp=1795140239&osig=AAAAAAAAAAAAAAAAAAAAAK3gDjYAwRGVpL9ps74OcQxJqmSG7rcfVq_dfeX1vuV6&signer=media-rpc&token=AAIAAU0AJDg5MGRjZDMzLTFhZTMtNDY2Ni1iM2YzLTk3Mjk5NGNkMjk3ZAAAAAABofayPpjul0lnQjpNDHs909tm2qgBpjw3HGSo0gi80WewZyam_g&x-canva-quality=thumbnail"
        run: |
          python3 -m pip install --quiet Pillow==11.3.0
          python3 scripts/create-og-preview-once.py
      - name: Zachowaj samowystarczalny JPEG w repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/assets/og-twoja-sprawa-votum-odszkodowania-2026.jpg
          git diff --cached --quiet && exit 1
          git commit -m "Wersja produkcyjna: samodzielnie hostowany podgląd Facebook 1200x630"
          git push origin HEAD:feat/facebook-udostepnianie-grafika-20261119
