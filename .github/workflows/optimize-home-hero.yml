name: Optymalizacja zatwierdzonej grafiki głównej — WebP
on:
  push:
    branches: [main]
    paths:
      - 'scripts/optimize-home-hero.py'
      - '.github/workflows/optimize-home-hero.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: twoja-sprawa-optimized-home-hero
  cancel-in-progress: false
jobs:
  optimize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install reproducible image encoder
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Create three visually identical responsive WebP variants
        run: python scripts/optimize-home-hero.py
      - name: Verify original approved Facebook graphic has not been modified
        run: |
          echo '489f8b499f49f841c6dec3f5777a791f4007ad9d5e8c109ceeed6cc83187798c  v2/assets/og-twoja-sprawa-metallic-v1.jpg' | sha256sum --check
          git diff --exit-code -- v2/assets/og-twoja-sprawa-metallic-v1.jpg
      - name: Commit image assets to the same first-party website repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2/assets/hero-twoja-sprawa-640.webp v2/assets/hero-twoja-sprawa-960.webp v2/assets/hero-twoja-sprawa-1536.webp
          if git diff --cached --quiet; then
            echo 'HERO_WEBP_ASSETS_UNCHANGED'
            exit 0
          fi
          git commit -m 'assets: lightweight responsive hero WebP from verified approved artwork'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo 'HERO_WEBP_ASSETS_PUBLISHED'
