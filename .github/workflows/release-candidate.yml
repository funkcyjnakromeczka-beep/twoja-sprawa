name: Kandydat produkcyjny — test bez wdrożenia
on:
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - 'scripts/build.mjs'
      - 'scripts/homepage-css-prune.mjs'
      - 'scripts/subpage-css-bundles.mjs'
      - 'scripts/test-subpage-bundles.mjs'
      - 'scripts/page-navigation.mjs'
      - 'scripts/media-navigation-quality.mjs'
      - 'scripts/content-anchors.mjs'
      - 'scripts/related-content.mjs'
      - 'scripts/test-support-2026-guidance.mjs'
      - 'scripts/test-related-content.mjs'
      - 'scripts/heading-permalinks.mjs'
      - 'scripts/test-heading-permalinks.mjs'
      - 'scripts/test-visible-breadcrumb-schema.mjs'
      - 'scripts/test-1000-release-checks.mjs'
      - 'scripts/test-content-anchors.mjs'
      - 'scripts/test-media-navigation-quality.mjs'
      - 'scripts/test-page-navigation.mjs'
      - 'scripts/network-brand.mjs'
      - 'scripts/public-routes.mjs'
      - 'scripts/seo-policy.mjs'
      - 'scripts/test-production-bundle.mjs'
      - 'scripts/test-brand-hero.mjs'
      - 'scripts/test-html-tags.mjs'
      - 'scripts/test-internal-links.mjs'
      - 'scripts/test-contact-client.mjs'
      - 'scripts/test-ai-referrals.mjs'
      - 'scripts/test-lead-summary.mjs'
      - 'scripts/test-crm-handoff.mjs'
      - 'scripts/test-service-share.mjs'
      - 'scripts/test-campaign-links.mjs'
      - 'scripts/test-geo-editorial.mjs'
      - 'scripts/test-brochures.mjs'
      - 'scripts/test-brochure-promo.mjs'
      - 'scripts/test-brochure-previews.mjs'
      - 'functions/plan-dzialania.js'
      - '.github/workflows/release-candidate.yml'
  pull_request:
    paths:
      - 'v2/**'
      - 'scripts/**'
      - 'functions/api/contact.js'
      - 'functions/plan-dzialania.js'
      - '.github/workflows/release-candidate.yml'
  workflow_dispatch:
concurrency:
  group: twoja-sprawa-release-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-candidate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Sprawdź składnię i pliki wydania
        run: |
          node --check scripts/build.mjs
          node --check scripts/subpage-css-bundles.mjs
          node --check scripts/test-subpage-bundles.mjs
          node --check scripts/page-navigation.mjs
          node --check scripts/test-page-navigation.mjs
          node --check scripts/media-navigation-quality.mjs
          node --check scripts/test-media-navigation-quality.mjs
          node --check scripts/content-anchors.mjs
          node --check scripts/test-content-anchors.mjs
          node --check scripts/related-content.mjs
          node --check scripts/test-related-content.mjs
          node --check scripts/test-support-2026-guidance.mjs
          node --check scripts/heading-permalinks.mjs
          node --check scripts/test-heading-permalinks.mjs
          node --check scripts/test-visible-breadcrumb-schema.mjs
          node --check scripts/test-1000-release-checks.mjs
          node --check scripts/test-production-bundle.mjs
          node --check scripts/test-og-facebook.mjs
          node --check scripts/test-brand-hero.mjs
          node --check scripts/test-network-brand.mjs
          node --check scripts/test-core-metadata.mjs
          node --check scripts/test-recruitment-guide.mjs
          node --check scripts/test-local-mining-mobile.mjs
          node --check scripts/test-faq-service-directory.mjs
          node --check scripts/test-contact.mjs
          node --check scripts/test-contact-client.mjs
          node --check scripts/test-html-tags.mjs
          node --check scripts/test-internal-links.mjs
          node --check scripts/test-ai-referrals.mjs
          node --check scripts/test-lead-summary.mjs
          node --check scripts/test-crm-handoff.mjs
          node --check scripts/test-service-share.mjs
          node --check scripts/test-campaign-links.mjs
          node --check scripts/test-geo-editorial.mjs
          node --check scripts/test-brochures.mjs
          node --check scripts/test-brochure-promo.mjs
          node --check v2/brochure-promo.js
          node --check scripts/test-brochure-previews.mjs
          node --check functions/plan-dzialania.js
          node --check scripts/test-search-index-freshness.mjs
      - name: Zbuduj i przetestuj kandydata wydania (bez publikacji)
        env:
          SITE_URL: https://twoja-sprawa.pages.dev
          RELEASE: '1'
          LEGAL_APPROVED: '1'
          CONTENT_APPROVED: '1'
          FORM_APPROVED: '1'
        run: |
          node scripts/build.mjs
          node scripts/test-campaign-flyer.mjs
          node scripts/test-offline-qr.mjs
          node scripts/test-og-facebook.mjs
          node scripts/test-brand-hero.mjs
          node scripts/test-page-navigation.mjs
          node scripts/test-media-navigation-quality.mjs
          node scripts/test-content-anchors.mjs
          node scripts/test-related-content.mjs
          node scripts/test-support-2026-guidance.mjs
          node scripts/test-heading-permalinks.mjs
          node scripts/test-visible-breadcrumb-schema.mjs
          node scripts/test-1000-release-checks.mjs --manifest
          node scripts/test-subpage-bundles.mjs
          node scripts/test-production-bundle.mjs
          node scripts/test-network-brand.mjs
          node scripts/test-core-metadata.mjs
          node scripts/test-recruitment-guide.mjs
          node scripts/test-local-mining-mobile.mjs
          node scripts/test-faq-service-directory.mjs
          node scripts/test-contact.mjs
          node scripts/test-contact-client.mjs
          node scripts/test-html-tags.mjs
          node scripts/test-internal-links.mjs
          node scripts/test-ai-referrals.mjs
          node scripts/test-lead-summary.mjs
          node scripts/test-crm-handoff.mjs
          node scripts/test-service-share.mjs
          node scripts/test-campaign-links.mjs
          node scripts/test-geo-editorial.mjs
          node scripts/test-brochures.mjs
          node scripts/test-brochure-promo.mjs
          node scripts/test-brochure-previews.mjs
          node scripts/test-search-index-freshness.mjs
      - name: Identyfikator zbudowanej wersji
        run: cat dist/release-info.json
      - name: Zapisz tymczasowy pakiet wydania do pobrania
        uses: actions/upload-artifact@v7
        with:
          name: twoja-sprawa-kandydat-produkcji
          path: dist/
          retention-days: 2
          if-no-files-found: error
