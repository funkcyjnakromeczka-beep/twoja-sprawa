name: Zrzuty ekranu — podgląd PC i telefon
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/screenshots.yml'
      - 'scripts/screenshot-preview.mjs'
      - 'scripts/network-brand.mjs'
      - 'v2/network-brand.css'
      - 'v2/visual-contrast.css'
      - 'v2/home-flow.css'
      - 'scripts/screenshot-preview.mjs'
      - 'v2/frankowicze.css'
      - 'v2/uslugi/kredyty-frankowe.html'
      - 'v2/uslugi/kredyty-pln.html'
      - 'v2/poradniki/frankowicze-lista-kontrolna.html'
      - 'v2/poradniki/skd-kredyt-pln-lista-kontrolna.html'
      - 'v2/index.html'
      - 'v2/o-nas.html'
      - 'v2/portrait-upgrade.css'
      - 'v2/knowledge-articles.css'
      - 'v2/knowledge-hub.css'
      - 'v2/knowledge-hub.js'
      - 'v2/article-accessibility.js'
      - 'v2/article-accessibility.css'
      - 'v2/contact-hub.css'
      - 'v2/kontakt.html'
      - 'v2/wiedza/index.html'
      - 'v2/faq.html'
      - 'v2/faq.js'
      - 'v2/faq.css'
      - 'v2/szukaj.html'
      - 'v2/site-search.css'
      - 'v2/site-search.js'
      - 'v2/search-pages-1.js'
      - 'v2/search-pages-2.js'
      - 'v2/search-faq-data.js'
      - 'v2/search-core.js'
      - 'v2/wiedza/**'
      - 'scripts/build.mjs'
      - 'v2/journey.css'
      - 'v2/lead-persona.css'
      - 'v2/service-navigator.js'
      - 'v2/plan-dzialania.html'
      - 'v2/plan-dzialania.js'
      - 'v2/plan-dzialania.css'
      - 'v2/contact.js'
      - 'v2/mobile-service-cta.js'
      - 'v2/mobile-service-cta.css'
      - 'v2/uslugi/szkody-gornicze.html'
      - 'v2/uslugi/swiadczenie-wspierajace.html'
      - 'v2/kampanie/szkody-gornicze.html'
      - 'v2/kampanie/swiadczenie-wspierajace.html'
jobs:
  screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Zbuduj podgląd bez indeksowania
        run: node scripts/preview.mjs
      - name: Zainstaluj przeglądarkę testową
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Wykonaj zrzuty ekranu
        run: node scripts/screenshot-preview.mjs
      - name: Udostępnij obrazy do kontroli, również przy błędach
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twoja-sprawa-podglad-pc-telefon
          path: screenshots/
          retention-days: 3
          if-no-files-found: warn
