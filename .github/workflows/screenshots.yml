name: Zrzuty ekranu — podgląd PC i telefon
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/screenshots.yml'
      - 'scripts/screenshot-preview.mjs'
      - 'scripts/network-brand.mjs'
      - 'v2/network-brand.css'
      - 'v2/index.html'
      - 'v2/o-nas.html'
      - 'v2/portrait-upgrade.css'
      - 'v2/knowledge-articles.css'
      - 'v2/wiedza/**'
      - 'scripts/build.mjs'
jobs:
  screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Zbuduj podgląd bez indeksowania
        run: node scripts/preview.mjs
      - name: Zainstaluj przeglądarkę testową
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Wykonaj zrzuty ekranu
        run: node scripts/screenshot-preview.mjs
      - name: Udostępnij obrazy do kontroli, również przy błędach
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twoja-sprawa-podglad-pc-telefon
          path: screenshots/
          retention-days: 3
          if-no-files-found: warn
