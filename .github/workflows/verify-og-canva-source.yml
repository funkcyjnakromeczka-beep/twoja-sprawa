name: Check uploaded Canva image source
on:
  push:
    paths:
      - .github/workflows/verify-og-canva-source.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Probe full-resolution CDN URL without saving credentials
        shell: bash
        env:
          OG_THUMB: "https://media.canva.com/v2/image-resize/format:PNG/height:105/quality:100/uri:ifs%3A%2F%2FM%2F083bf609-b159-49f7-b297-700159c6aff1/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAH_9hZVgV7ZzmF2HKToZdm0d-F1AOOaf8mQVEvw5iMgO&exp=1795412868&osig=AAAAAAAAAAAAAAAAAAAAAK0sFmqM_7AOdDapwHrixdkanA8mYZty85bKMAkp5exj&signer=media-rpc&token=AAIAAU0AJDA4M2JmNjA5LWIxNTktNDlmNy1iMjk3LTcwMDE1OWM2YWZmMQAAAAABogbyO6CzALpDfhT_a_u94ZAhjaysfNM_7zx6MlolKacGi2Es5Q&x-canva-quality=thumbnail"
        run: |
          set -eu
          for variant in thumb full width_only clean; do
            url="$OG_THUMB"
            case "$variant" in
              full) url="${url/height:105/height:630}"; url="${url/width:200/width:1200}" ;;
              width_only) url="${url/width:200/width:1200}" ;;
              clean) url="${url/format:PNG\/height:105\/quality:100/format:JPEG\/height:630\/quality:90}"; url="${url/width:200/width:1200}" ;;
            esac
            status=$(curl -L --connect-timeout 5 --max-time 22 -s -o "/tmp/$variant" -w "%{http_code}" "$url" || true)
            echo "CANVA_IMAGE_PROBE $variant http=$status bytes=$(wc -c < "/tmp/$variant") type=$(file -b "/tmp/$variant"|cut -c1-100)"
          done
